    </text>
    <text x="724" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Auskunftsanspruch &amp; EU-Richtlinie
    </text>
  </g>

  <!-- Bottom Strip -->
  <g transform="translate(80, 580)">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">
      100 % Werbefrei · Wissenschaftliche Quartilsmethode · Zero-CDN · Geprüft Stand September 2026
    </text>
  </g>
</svg>
