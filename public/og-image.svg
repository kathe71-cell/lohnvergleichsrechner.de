
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.6"/>

  <!-- Left Accent Bar -->
  <rect x="0" y="0" width="12" height="630" fill="#059669"/>

  <!-- Top Badge -->
  <g transform="translate(80, 80)">
    <rect width="440" height="40" rx="20" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="1.5"/>
    <text x="20" y="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="800" fill="#065f46" letter-spacing="1">
      DESTATIS VSE · BUNDESAGENTUR FÜR ARBEIT
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(80, 190)">
    <text font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="64" font-weight="900" fill="#0f172a" letter-spacing="-2">
      lohnvergleichsrechner<tspan fill="#059669">.de</tspan>
    </text>
    <text y="65" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="32" font-weight="700" fill="#475569">
      Lohn- &amp; Gehaltsvergleich Deutschland (KldB 2010)
    </text>
  </g>

  <!-- Key Metrics Bento Grid -->
  <g transform="translate(80, 340)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="320" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">
      BUNDESWEITER MEDIAN
    </text>
    <text x="24" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="44" font-weight="900" fill="#0f172a">
      4.100 €
    </text>
    <text x="24" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      pro Monat (Vollzeitbeschäftigte)
    </text>

    <!-- Box 2 -->
    <rect x="350" y="0" width="320" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="374" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">
      REGIONALER KORRIDOR
    </text>
    <text x="374" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="44" font-weight="900" fill="#059669">
      16 Länder
    </text>
    <text x="374" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="500" fill="#64748b">
      Hamburg (+9,5 %) bis MV (-20,5 %)
    </text>

    <!-- Box 3 -->
    <rect x="700" y="0" width="340" height="180" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="724" y="45" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1">
      RECHTSGRUNDLAGEN
    </text>
    <text x="724" y="105" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, monospace" font-size="40" font-weight="900" fill="#0f172a">
